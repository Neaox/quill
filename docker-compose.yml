# Local infrastructure for development and integration tests.
# Postgres holds system data; RustFS stands in for S3-compatible blob storage.
# Nothing else is required to run Quill locally (quill-plan.md, section 28).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quill
      POSTGRES_PASSWORD: quill
      POSTGRES_DB: quill
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quill -d quill']
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO stopped publishing community images, so this is RustFS: Apache 2.0,
  # S3-compatible, with the same ports (9000 S3 API, 9001 console). It is
  # pre-release software, which is acceptable for throwaway local data only.
  rustfs:
    image: rustfs/rustfs:1.0.1
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: quill
      RUSTFS_SECRET_KEY: quillquill
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://localhost:9000/health']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  rustfs-data:
