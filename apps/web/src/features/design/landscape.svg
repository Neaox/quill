<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="System landscape">
  <title>System landscape</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2438" />
      <stop offset="55%" stop-color="#22304f" />
      <stop offset="100%" stop-color="#2b2f52" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2fb" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7aa2fb" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)" />

  <g stroke="#7aa2fb" stroke-opacity="0.09" stroke-width="1">
    <path d="M0 130h1200M0 260h1200M0 390h1200" />
    <path d="M200 0v520M400 0v520M600 0v520M800 0v520M1000 0v520" />
  </g>

  <g font-family="Inter Variable, system-ui, sans-serif" font-size="15" fill="#cfd9f0">
    <g stroke="url(#edge)" stroke-width="2" fill="none">
