      <path d="M300 380h0c90 0 130-40 190-65l110-45" />
      <path d="M760 260h150" />
      <path d="M760 260c60 0 90 60 150 60" />
      <path d="M760 260c60 0 90-60 150-60" />
    </g>

    <g>
      <rect x="80" y="108" width="220" height="84" rx="14" fill="#111a2e" stroke="#7aa2fb"
