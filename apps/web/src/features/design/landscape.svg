      <text x="104" y="140" fill="#f2f5fc" font-weight="600">Reading surface</text>
      <text x="104" y="164" fill="#9fb0d0" font-size="13">Server rendered</text>
    </g>

    <g>
      <rect x="80" y="338" width="220" height="84" rx="14" fill="#111a2e" stroke="#7aa2fb"
