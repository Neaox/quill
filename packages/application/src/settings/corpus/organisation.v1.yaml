# A version 1 organisation settings file, as version 1 wrote it (ADR-033 format corpus).
# Never edit: every later release must read this file.
version: 1
name: Acme
theme:
  id: instrument
  name: Instrument
  seeds:
    tone:
      hue: 250
      chroma: 0.008
    accent:
      hue: 45
      chroma: 0.2
      lightness: 62
  type:
    display:
      source: curated
      id: ibm-plex-sans
    reading:
      source: curated
      id: ibm-plex-serif
    interface:
      source: curated
      id: ibm-plex-sans
    mono:
      source: curated
      id: ibm-plex-mono
  variants: &a1
    comments: panel
    history: timeline
    navigation: tree
    header: readout
    rules: hairline
  shape:
    radiusStep: 2
    density: compact
  levers:
    - accent
    - tone
    - logo
    - density
    - radius
    - reading-face
layout:
  default: *a1
  locked: false
publicNavigation:
  - label: Handbook
    href: /handbook
  - label: Status
    href: https://status.example.com
policies:
  shareLinksAllowed: true
  publicPublishingAllowed: false
  contrastEnforcement: enforced
